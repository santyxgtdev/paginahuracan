<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada (404) — Club Deportivo Huracán</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0b0d">
<link rel="canonical" href="https://clubdeportivohuracan.com/404.html">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/escudo-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--ink:#f5f2ea;--mut:#aaa6af;--red:#e31b23;--line:rgba(245,242,234,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;padding:16px clamp(20px,5vw,64px);border-bottom:1px solid var(--line)}
header img{width:40px;height:40px}
header b{font-family:'Anton','Impact',sans-serif;font-weight:400;font-size:1.05rem;letter-spacing:.04em}
main{flex:1;display:grid;place-content:center;text-align:center;padding:60px 20px}
.eyebrow{color:var(--mut);letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;font-weight:700}
.code{font-family:'Anton','Impact',sans-serif;line-height:.9;text-transform:uppercase;margin-top:18px}
.code i{font-style:normal;color:var(--red)}
.code{font-size:clamp(5rem,22vw,13rem)}
h1{font-family:'Anton','Impact',sans-serif;text-transform:uppercase;font-size:clamp(1.6rem,4.5vw,2.6rem);margin-top:10px}
p{color:var(--mut);max-width:46ch;margin:16px auto 0}
nav{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:14px 28px;border-radius:2px;font-weight:700;font-size:.95rem;text-decoration:none;border:1px solid transparent;transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn--red{background:var(--red);color:#fff}
.btn--ghost{border-color:var(--line)}
footer{padding:18px;text-align:center;color:#87838c;font-size:.8rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <img src="/images/escudo-128.png" alt="Escudo del Club Deportivo Huracán" width="40" height="40">
  <b>HURACÁN</b>
</header>
<main>
  <p class="eyebrow">Error 404</p>
  <p class="code">4<i>0</i>4</p>
  <h1>Balón fuera de cancha</h1>
  <p>La página que buscas no existe o cambió de dirección. Volvamos a la cancha: en la home formamos campeones.</p>
  <nav aria-label="Enlaces de ayuda">
    <a class="btn btn--red" href="/">Volver al inicio</a>
    <a class="btn btn--ghost" href="/#inscripcion">Inscríbete</a>
    <a class="btn btn--ghost" href="/#contacto">Contacto</a>
  </nav>
</main>
<footer>© 2026 Club Deportivo Huracán · Bogotá D.C.</footer>
</body>
</html>
